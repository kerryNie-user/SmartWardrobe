<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>SmartWardrobe - AI Prompt Chain Editorial</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500&display=swap');

        :root {
            --bg-color: #fcfbf9;
            --text-color: #1a1a1a;
            --text-light: #666666;
            --accent-color: #3a3a3a;
            --border-color: #e5e3db;
            --font-serif: 'Playfair Display', serif;
            --font-sans: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-sans);
            line-height: 1.8;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 20px;
        }
        
        /* Global Image Rule to PREVENT STRETCHING */
        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .header {
            text-align: center;
            margin-bottom: 80px;
            padding-bottom: 40px;
            border-bottom: 1px solid var(--border-color);
        }
        .header h1 {
            font-family: var(--font-serif);
            font-size: 28px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
            margin: 0 0 12px 0;
        }
        .header p {
            color: var(--text-light);
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 0;
        }

        .post { margin-bottom: 120px; }
        .post-title {
            font-family: var(--font-serif);
            font-size: 46px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 24px;
            line-height: 1.2;
            color: var(--text-color);
        }
        .post-meta {
            text-align: center;
            font-family: var(--font-sans);
            font-size: 12px;
            color: var(--text-light);
            margin-bottom: 60px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        
        .paragraph-block { margin-bottom: 60px; clear: both; }
        .text-content {
            font-size: 17px;
            text-align: justify;
            color: #333;
            font-weight: 300;
        }
        .text-content strong {
            font-family: var(--font-sans);
            font-weight: 500;
            color: #000;
        }
        
        /* Layouts with strict aspect ratios for images */
        .layout-hero {
            margin: 0 0 50px 0;
            width: 100%;
            aspect-ratio: 16/9;
            background: #eee;
            overflow: hidden;
            clear: both;
        }
        
        .layout-float-right {
            float: right;
            width: 45%;
            margin: 10px 0 30px 40px;
            aspect-ratio: 3/4;
            background: #eee;
            overflow: hidden;
        }
        
        .layout-float-left {
            float: left;
            width: 45%;
            margin: 10px 40px 30px 0;
            aspect-ratio: 3/4;
            background: #eee;
            overflow: hidden;
        }
        
        .layout-split {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
            margin: 60px 0;
        }
        .layout-split .split-media {
            aspect-ratio: 3/4;
            background: #eee;
            overflow: hidden;
        }
        .layout-split .split-text {
            padding: 0;
        }

        .layout-lookbook {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: 60px 0;
            clear: both;
        }
        .layout-lookbook .look-card {
            display: flex;
            flex-direction: column;
        }
        .layout-lookbook .look-media {
            aspect-ratio: 3/4;
            background: #eee;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .layout-lookbook .look-title {
            font-family: var(--font-serif);
            font-size: 14px;
            font-style: italic;
            text-align: center;
            color: var(--text-light);
            margin: 0;
        }

        .layout-mosaic {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 60px 0;
            clear: both;
        }
        .layout-mosaic .mosaic-item {
            aspect-ratio: 1/1;
            background: #eee;
            overflow: hidden;
        }

        .image-caption {
            margin-top: 12px;
            font-family: var(--font-sans);
            font-size: 11px;
            color: var(--text-light);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .clearfix::after { content: ""; clear: both; display: table; }
        .divider {
            text-align: center;
            margin: 80px 0;
            color: var(--border-color);
            font-size: 24px;
            letter-spacing: 20px;
            clear: both;
        }
        .drop-cap::first-letter {
            font-family: var(--font-serif);
            font-size: 4em;
            float: left;
            line-height: 0.8;
            margin-right: 12px;
            margin-top: 6px;
            color: var(--accent-color);
        }

        .layout-pull-quote {
            font-family: var(--font-serif);
            font-size: 22px;
            font-style: italic;
            text-align: center;
            margin: 60px 40px;
            color: #333333;
            padding: 40px 0;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            line-height: 1.6;
            clear: both;
        }
        .layout-tip-box {
            background-color: #fff;
            padding: 40px;
            margin: 60px 0;
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent-color);
            clear: both;
        }

        @media (max-width: 768px) {
            .container { padding: 30px 20px; }
            .post-title { font-size: 32px; }
            .layout-float-right, .layout-float-left {
                float: none; width: 100%; margin: 0 0 30px 0;
            }
            .layout-split { grid-template-columns: 1fr; gap: 30px; }
            .layout-lookbook, .layout-mosaic {
                display: flex;
                flex-wrap: nowrap;
                overflow-x: auto;
                scroll-snap-type: x mandatory;
                gap: 15px;
                margin: 40px -20px;
                padding: 0 20px 20px 20px;
                -webkit-overflow-scrolling: touch;
            }
            .layout-lookbook .look-card, .layout-mosaic .mosaic-item {
                min-width: 80%;
                flex: 0 0 80%;
                scroll-snap-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>SMARTWARDROBE EDITORIAL</h1>
            <p>Powered by AI Prompt Chain Pipeline</p>
        </div>
        {content}
    </div>
</body>
</html>
